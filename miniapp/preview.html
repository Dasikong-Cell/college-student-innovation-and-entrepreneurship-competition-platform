<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>创新创业大赛平台 - 小程序预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e5e7eb;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    gap: 30px;
  }

  .phone-frame {
    width: 390px;
    height: 844px;
    background: #000;
    border-radius: 50px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    position: relative;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    background: #f5f7fa;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* 状态栏 */
  .status-bar {
    height: 44px;
    background: #3b82f6;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    color: white;
    font-size: 12px;
    font-weight: 600;
  }

  /* 导航栏 */
  .nav-bar {
    height: 44px;
    background: #3b82f6;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
  }

  /* ========== 登录页 ========== */
  .login-page {
    flex: 1;
    background: linear-gradient(160deg, #3b82f6 0%, #2563eb 60%, #1d4ed8 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 36px 30px;
  }
  .login-header { text-align: center; padding-top: 40px; }
  .logo-icon {
    width: 90px; height: 90px;
    background: #fff;
    border-radius: 24px;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 700; color: #3b82f6;
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
  }
  .app-name { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .app-desc { font-size: 13px; color: rgba(255,255,255,0.85); }
  .btn-wrap { padding-bottom: 20px; }
  .wx-login-btn {
    background: #fff; color: #1f2937;
    font-size: 16px; font-weight: 500;
    border-radius: 12px; padding: 14px 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    width: 100%; border: none; cursor: pointer;
  }
  .toggle-link {
    text-align: center; margin-top: 20px;
    color: rgba(255,255,255,0.9); font-size: 13px; cursor: pointer;
    text-decoration: underline;
  }
  .test-login-box { margin-top: 20px; background: rgba(255,255,255,0.15); border-radius: 12px; padding: 20px; backdrop-filter: blur(10px); }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 13px; color: rgba(255,255,255,0.9); margin-bottom: 6px; font-weight: 500; }
  .form-input {
    width: 100%; background: rgba(255,255,255,0.9);
    border: none; border-radius: 8px; padding: 12px 14px;
    font-size: 14px; color: #1f2937;
  }
  .btn-login {
    width: 100%; background: #fff; color: #3b82f6;
    border: none; border-radius: 10px; padding: 12px 0;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
  }
  .login-footer { text-align: center; padding-bottom: 20px; color: rgba(255,255,255,0.7); font-size: 11px; }

  /* ========== 大赛列表页 ========== */
  .page-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    padding-bottom: 70px;
  }
  .page-content::-webkit-scrollbar { display: none; }

  .search-bar { margin-bottom: 10px; }
  .search-input-wrap {
    background: #fff; border-radius: 20px; padding: 8px 16px;
    display: flex; align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .search-icon { font-size: 14px; margin-right: 8px; }
  .search-input { flex: 1; font-size: 14px; border: none; outline: none; background: transparent; }

  .category-bar { margin-bottom: 10px; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; }
  .category-bar::-webkit-scrollbar { display: none; }
  .cat-item {
    display: inline-block; padding: 6px 16px; margin-right: 8px;
    background: #fff; border-radius: 16px; font-size: 13px;
    color: #6b7280; box-shadow: 0 1px 2px rgba(0,0,0,0.04); cursor: pointer;
  }
  .cat-active { background: #3b82f6; color: #fff; }

  .card {
    background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .comp-top { display: flex; align-items: center; justify-content: space-between; }
  .comp-title { font-size: 16px; font-weight: 600; color: #1f2937; flex: 1; margin-right: 8px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; }
  .tag-gray { background: #f3f4f6; color: #4b5563; }
  .tag-green { background: #dcfce7; color: #15803d; }
  .tag-red { background: #fee2e2; color: #b91c1c; }
  .tag-orange { background: #ffedd5; color: #c2410c; }

  .divider { height: 1px; background: #e5e7eb; margin: 12px 0; }
  .meta-row { font-size: 12px; color: #6b7280; line-height: 1.8; }
  .meta-label { color: #9ca3af; }
  .meta-value { color: #4b5563; }
  .comp-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  .register-btn {
    background: #3b82f6; color: #fff; border: none;
    padding: 7px 18px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .register-btn.outline {
    background: #fff; color: #3b82f6; border: 1px solid #3b82f6;
  }

  .empty-wrap { padding: 80px 0; text-align: center; color: #9ca3af; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  .loading-wrap { padding: 40px 0; text-align: center; color: #9ca3af; font-size: 13px; }

  /* TabBar */
  .tabbar {
    height: 56px; background: #fff; border-top: 1px solid #e5e7eb;
    display: flex;
  }
  .tabbar-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 10px; color: #999; gap: 2px; cursor: pointer;
  }
  .tabbar-item.active { color: #3b82f6; }
  .tab-icon { font-size: 20px; }

  /* ========== 首页 ========== */
  .home-banner {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 12px; padding: 24px; margin-bottom: 16px;
    color: #fff;
  }
  .home-banner h2 { font-size: 18px; margin-bottom: 6px; }
  .home-banner p { font-size: 12px; opacity: 0.85; }
  .announcement-card {
    background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .announcement-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 6px; }
  .announcement-meta { font-size: 11px; color: #9ca3af; }

  /* 手机切换视图 */
  .phone-title { text-align: center; margin-bottom: 12px; font-size: 14px; color: #6b7280; font-weight: 500; }
  .phone-title strong { color: #3b82f6; }

  /* 控制信息 */
  .side-info {
    max-width: 320px;
    font-size: 13px;
    color: #374151;
    line-height: 1.8;
  }
  .side-info h3 { font-size: 16px; color: #1f2937; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #3b82f6; display: inline-block; }
  .side-info pre {
    background: #1f2937; color: #10b981; padding: 12px; border-radius: 8px;
    overflow-x: auto; font-size: 12px; margin-top: 8px;
    white-space: pre-wrap; word-break: break-all;
  }
  .api-status {
    background: #ecfdf5; color: #065f46; padding: 8px 12px;
    border-radius: 8px; margin-bottom: 8px; font-size: 12px;
    border: 1px solid #a7f3d0;
  }
  .api-status.error { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .btn-test {
    background: #3b82f6; color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; cursor: pointer; margin-right: 8px;
  }
  .btn-test:hover { background: #2563eb; }
</style>
</head>
<body>

<div>
  <div class="phone-title"><strong>大学生创新创业大赛平台</strong> · 小程序预览</div>
  <div class="phone-frame">
    <div class="phone-screen" id="phoneScreen">
      <!-- 动态渲染 -->
    </div>
  </div>
</div>

<div class="side-info">
  <h3>🔌 后端 API 状态</h3>
  <div id="apiStatus"></div>
  <button class="btn-test" onclick="loadCompetitionList()">刷新大赛列表</button>

  <h3 style="margin-top:24px;">🧪 测试账号</h3>
  <div>管理员：admin / 123456</div>
  <div>专家：expert1 / 123456</div>
  <div>学生：student01 / 123456</div>

  <h3 style="margin-top:24px;">📡 API 响应示例</h3>
  <pre id="apiResponse">等待加载...</pre>

  <h3 style="margin-top:24px;">📝 使用说明</h3>
  <div style="font-size:12px;color:#6b7280;">
    左侧为微信小程序手机预览视图，可切换登录页和大赛列表页。
    所有数据通过本地 SpringBoot 后端 API 获取。
  </div>
</div>

<script>
const API_BASE = 'http://localhost:8090/api';
let token = '';
let currentUser = null;
let currentPage = 'login';

const mockAnnouncements = [
  { id: 1, title: '关于举办第九届互联网+大赛的通知', createdAt: '2026-06-15' },
  { id: 2, title: '创新创业训练营报名开始', createdAt: '2026-07-01' },
  { id: 3, title: '第五届智能制造大赛专家名单公布', createdAt: '2026-07-08' }
];

function setApiStatus(text, ok = true) {
  const el = document.getElementById('apiStatus');
  el.className = 'api-status' + (ok ? '' : ' error');
  el.textContent = text;
}

function setApiResponse(data) {
  document.getElementById('apiResponse').textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
}

function phoneHTML(body) {
  return `
    <div class="status-bar">
      <span>9:41</span>
      <span style="display:flex;gap:4px;align-items:center;">
        <span>●●●</span>
        <span>📶</span>
        <span>🔋</span>
      </span>
    </div>
    ${body}
  `;
}

function renderLoginPage() {
  document.getElementById('phoneScreen').innerHTML = phoneHTML(`
    <div style="flex:1;display:flex;flex-direction:column;">
      <div class="login-page">
        <div>
          <div class="login-header">
            <div class="logo-icon">创</div>
            <div class="app-name">创新创业大赛平台</div>
            <div class="app-desc">大学生专属赛事平台</div>
          </div>

          <div class="btn-wrap">
            <button class="wx-login-btn" onclick="alert('微信登录需要在真机上测试')">
              微信一键登录
            </button>
            <div class="toggle-link" onclick="document.getElementById('testBox').style.display=document.getElementById('testBox').style.display==='none'?'block':'none'">
              使用测试账号登录 ▼
            </div>

            <div id="testBox" class="test-login-box">
              <div class="form-group">
                <label class="form-label">用户名</label>
                <input class="form-input" id="loginUsername" placeholder="student01 / admin" value="student01">
              </div>
              <div class="form-group">
                <label class="form-label">密码</label>
                <input class="form-input" id="loginPassword" type="password" placeholder="请输入密码" value="123456">
              </div>
              <button class="btn-login" onclick="doLogin()">登录</button>
            </div>
          </div>
        </div>
        <div class="login-footer">登录即代表同意《用户协议》和《隐私政策》</div>
      </div>
    </div>
  `);
  document.getElementById('testBox').style.display = 'block';
  currentPage = 'login';
}

async function doLogin() {
  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const resp = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    setApiResponse(data);
    if (data.code === 200 && data.data) {
      token = data.data.token;
      currentUser = data.data;
      setApiStatus(`✅ 登录成功！${currentUser.name} (${currentUser.role})`);
      setTimeout(() => {
        if (currentUser.role === 'admin' || currentUser.role === 'expert') {
          showHomeAfterLogin();
        } else {
          renderCompetitionList();
        }
      }, 500);
    } else {
      setApiStatus('❌ ' + (data.msg || '登录失败'), false);
    }
  } catch (e) {
    setApiStatus('❌ 请求失败: ' + e.message, false);
  }
}

async function loadCompetitionList() {
  try {
    setApiStatus('⏳ 正在请求大赛列表...');
    const resp = await fetch(API_BASE + '/competition/page?current=1&size=10');
    const data = await resp.json();
    setApiResponse(data);
    if (data.code === 200 && data.data) {
      setApiStatus(`✅ 已加载 ${data.data.records.length} 个大赛 (共${data.data.total}个)`);
      renderCompetitionList(data.data.records);
    } else {
      setApiStatus('❌ 加载失败', false);
    }
  } catch (e) {
    setApiStatus('❌ 请求失败: ' + e.message, false);
  }
}

function statusTag(status) {
  const map = {
    published: '<span class="tag tag-green">报名中</span>',
    judging: '<span class="tag tag-orange">评审中</span>',
    finished: '<span class="tag tag-gray">已结束</span>',
    draft: '<span class="tag tag-gray">草稿</span>'
  };
  return map[status] || `<span class="tag tag-gray">${status}</span>`;
}

function formatTime(t) {
  if (!t) return '-';
  return t.replace('T', ' ').substring(0, 16);
}

function renderCompetitionList(records) {
  records = records || [];
  let cards = records.length === 0
    ? `<div class="empty-wrap"><div class="empty-icon">🎯</div>暂无大赛</div>`
    : records.map(item => `
      <div class="card">
        <div class="comp-top">
          <div class="comp-title">${item.title}</div>
          ${statusTag(item.status)}
        </div>
        ${item.category ? `<div style="margin-top:6px;"><span class="tag tag-orange">${item.category}</span></div>` : ''}
        <div class="divider"></div>
        <div class="meta-row"><span class="meta-label">报名时间：</span><span class="meta-value">${formatTime(item.registerStart)} ~ ${formatTime(item.registerEnd)}</span></div>
        <div class="meta-row"><span class="meta-label">比赛时间：</span><span class="meta-value">${formatTime(item.startTime)} ~ ${formatTime(item.endTime)}</span></div>
        <div class="comp-actions">
          <button class="register-btn ${item.status !== 'published' ? 'outline' : ''}">${item.status === 'published' ? '立即申报' : '查看详情'}</button>
        </div>
      </div>
    `).join('');

  const navTitle = currentPage === 'home' ? '首页' : currentPage === 'competition' ? '大赛列表' : '登录';
  document.getElementById('phoneScreen').innerHTML = `
    <div class="status-bar">
      <span>9:41</span>
      <span style="display:flex;gap:4px;align-items:center;"><span>●●●</span><span>📶</span><span>🔋</span></span>
    </div>
    <div class="nav-bar">大赛列表</div>
    <div class="page-content">
      <div class="search-bar">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input class="search-input" placeholder="搜索大赛名称" />
        </div>
      </div>
      ${cards}
    </div>
    <div class="tabbar">
      <div class="tabbar-item" onclick="renderHome()">
        <span class="tab-icon">🏠</span><span>首页</span>
      </div>
      <div class="tabbar-item active">
        <span class="tab-icon">🏆</span><span>大赛</span>
      </div>
      <div class="tabbar-item">
        <span class="tab-icon">📋</span><span>我的项目</span>
      </div>
      <div class="tabbar-item">
        <span class="tab-icon">👤</span><span>我的</span>
      </div>
    </div>
  `;
  currentPage = 'competition';
}

function renderHome() {
  document.getElementById('phoneScreen').innerHTML = `
    <div class="status-bar">
      <span>9:41</span>
      <span style="display:flex;gap:4px;align-items:center;"><span>●●●</span><span>📶</span><span>🔋</span></span>
    </div>
    <div class="nav-bar">首页</div>
    <div class="page-content">
      <div class="home-banner">
        <h2>创新创业大赛平台</h2>
        <p>发现赛事 · 提交申报 · 追踪结果</p>
      </div>
      <div class="section-title" style="font-size:15px;font-weight:600;color:#1f2937;margin-bottom:10px;padding-left:10px;border-left:3px solid #3b82f6;">📢 最新公告</div>
      ${mockAnnouncements.map(a => `
        <div class="announcement-card">
          <div class="announcement-title">${a.title}</div>
          <div class="announcement-meta">发布于 ${a.createdAt}</div>
        </div>
      `).join('')}
      <div style="text-align:center;color:#9ca3af;font-size:12px;margin-top:20px;" onclick="renderCompetitionList()">
        点击查看全部大赛 →
      </div>
    </div>
    <div class="tabbar">
      <div class="tabbar-item active"><span class="tab-icon">🏠</span><span>首页</span></div>
      <div class="tabbar-item" onclick="renderCompetitionList()"><span class="tab-icon">🏆</span><span>大赛</span></div>
      <div class="tabbar-item"><span class="tab-icon">📋</span><span>我的项目</span></div>
      <div class="tabbar-item"><span class="tab-icon">👤</span><span>我的</span></div>
    </div>
  `;
  currentPage = 'home';
}

function showHomeAfterLogin() {
  renderHome();
  loadCompetitionList();
}

// 初始化：先登录然后展示大赛列表
(async function init() {
  try {
    setApiStatus('⏳ 正在检测后端服务...');
    const resp = await fetch(API_BASE + '/competition/page?current=1&size=3');
    if (resp.ok) {
      setApiStatus('✅ 后端 API 连接正常');
      // 自动用 student01 登录
      const loginResp = await fetch(API_BASE + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'student01', password: '123456' })
      });
      const loginData = await loginResp.json();
      if (loginData.code === 200) {
        token = loginData.data.token;
        currentUser = loginData.data;
        setApiStatus(`✅ 已登录：${currentUser.name} (${currentUser.role})`);
      }
      setTimeout(() => loadCompetitionList(), 300);
    } else {
      setApiStatus('❌ 后端服务未启动，请先启动 SpringBoot 后端', false);
      renderLoginPage();
    }
  } catch (e) {
    setApiStatus('❌ 无法连接后端：' + e.message, false);
    renderLoginPage();
  }
})();
</script>

</body>
</html>
