server:
  port: 8090

spring:
  application:
    name: innovation-competition-platform
  datasource:
    url: jdbc:mysql://localhost:3306/innovation_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  configuration:
    # 不再把完整 SQL（含参数）打印到 stdout，改为走 Slf4j（由 logback 控制级别）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

jwt:
  # ⚠️ 生产环境必须通过环境变量 JWT_SECRET 覆盖，切勿使用默认值
  secret: ${JWT_SECRET:change-me-in-production}
  expire-hours: 24

wx:
  miniapp:
    appid: wx_demo_appid
    secret: ${WX_SECRET:wx_demo_secret}

upload:
  # 上传目录可通过环境变量 UPLOAD_DIR 覆盖，默认相对路径（便于容器/多环境部署）
  dir: ${UPLOAD_DIR:./uploads/competition}
  public-url: http://localhost:8090/files/
